<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{SEO_TITLE}}</title>
    
        <meta
            name="description"
            content="{{SEO_DESCRIPTION}}"
        />
        <link rel="icon" type="image/png" href="{{SEO_FAVICON}}" />

        <!-- Preload Critical Modules -->
        <link rel="modulepreload" href="js/app.js">
        <link rel="modulepreload" href="js/cms.js">
        <link rel="modulepreload" href="js/theme.js">
        <link rel="modulepreload" href="js/shared/BaseComponent.js">
        <link rel="modulepreload" href="js/shared/booking.js">
        <link rel="modulepreload" href="js/utils/BookingUtils.js">

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="{{SEO_URL}}" />
        <meta property="og:title" content="{{SEO_TITLE}}" />
        <meta property="og:description" content="{{SEO_DESCRIPTION}}" />
        <meta property="og:image" content="{{SEO_IMAGE}}" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="{{SEO_URL}}" />
        <meta property="twitter:title" content="{{SEO_TITLE}}" />
        <meta property="twitter:description" content="{{SEO_DESCRIPTION}}" />
        <meta property="twitter:image" content="{{SEO_IMAGE}}" />

        <!-- Structured Data (JSON-LD) -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "VacationRental",
            "name": "{{SEO_TITLE}}",
            "description": "{{SEO_DESCRIPTION}}",
            "image": "{{SEO_IMAGE}}",
            "address": {
                "@type": "PostalAddress",
                "streetAddress": "{{SEO_ADDRESS_STREET}}",
                "addressLocality": "{{SEO_ADDRESS_LOCALITY}}",
                "postalCode": "{{SEO_ADDRESS_ZIP}}",
                "addressCountry": "FR"
            },
            "geo": {
                "@type": "GeoCoordinates",
                "latitude": {{SEO_LAT}},
                "longitude": {{SEO_LNG}}
            },
            "url": "{{SEO_URL}}",
            "telephone": "{{SEO_PHONE}}",
            "priceRange": "{{SEO_PRICE_RANGE}}"
        }
        </script>

        <!-- Tailwind CSS (Built via CLI) -->
        <!-- <link rel="stylesheet" href="css/style.css" /> is already included below -->

        <!-- Leaflet CSS & JS -->
        <link
            rel="stylesheet"
            href="css/vendor/leaflet/leaflet.css"
            media="print"
            onload="this.media='all'"
        />
        <noscript><link rel="stylesheet" href="css/vendor/leaflet/leaflet.css"></noscript>
        <script src="js/vendor/leaflet.js" defer></script>

        <!-- Google Fonts (font families are loaded by the active theme, see js/themes/*/index.js) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- Lucide Icons -->
        <script src="js/vendor/lucide.js" defer></script>

        <!-- Custom Styles -->
        <link rel="preload" href="css/style.css" as="style" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="antialiased">
        <!-- L'application est montée ici -->
        <app-root></app-root>

        <!-- Application Logic (theme-specific assets are loaded by js/theme.js) -->
        <script type="module" src="js/app.js"></script>
    </body>
</html>
