<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{SEO_TITLE}}</title>

        <meta
            name="description"
            content="{{SEO_DESCRIPTION}}"
        />
        <link rel="canonical" href="{{SEO_URL}}" />

        <!-- Preload Critical Modules -->
        <link rel="modulepreload" href="js/app.js">
        <link rel="modulepreload" href="js/cms.js">
        <link rel="modulepreload" href="js/theme.js">
        <link rel="modulepreload" href="js/shared/BaseComponent.js">
        <link rel="modulepreload" href="js/shared/booking.js">
        <link rel="modulepreload" href="js/utils/BookingUtils.js">

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="fr_FR" />
        <meta property="og:url" content="{{SEO_URL}}" />
        <meta property="og:title" content="{{SEO_TITLE}}" />
        <meta property="og:description" content="{{SEO_DESCRIPTION}}" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{SEO_TITLE}}" />
        <meta name="twitter:description" content="{{SEO_DESCRIPTION}}" />

        <!-- seo:head (favicon, share image, font preloads and structured data, from the CMS: pb_hooks/seo.pb.js) -->

        <!-- Lucide Icons (only the icons used, see scripts/vendor.js) -->
        <script src="js/vendor/lucide.js" defer></script>

        <!-- Custom Styles (Tailwind, built via CLI) -->
        <link rel="preload" href="css/style.css" as="style" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="antialiased">
        <!-- L'application est montée ici. pb_hooks/seo.pb.js y insère le contenu du CMS pour les moteurs de recherche -->
        <app-root></app-root>

        <!-- Application Logic (theme-specific assets are loaded by js/theme.js, Leaflet by the map section) -->
        <script type="module" src="js/app.js"></script>
    </body>
</html>
